<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ghir-a9ra-barka</title>
  <meta name="theme-color" content="#1e1e2e">
  <meta name="description" content="Cours, TD, TP, corrections et résumés de la classe.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23cba6f7'/><text x='50' y='68' font-size='54' font-weight='700' font-family='monospace' text-anchor='middle' fill='%231e1e2e'>gb</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Literata:ital,wght@0,400;0,600;0,800;1,400&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Re-apply the last theme before first paint so there is no flash.
    try {
      const vars = JSON.parse(localStorage.getItem('cozy.themeVars'));
      for (const k in vars) document.documentElement.style.setProperty(k, vars[k]);
    } catch {}
    // Safety net: if the site hasn't started after 12 s (an old copy of a file, a crash),
    // offer a clean reload that throws away the offline copy.
    setTimeout(function () {
      if (window.__booted) return;
      var box = document.createElement('div');
      box.setAttribute('style', 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:#313244;color:#cdd6f4;font:14px system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)');
      box.innerHTML = '<span>Le site ne démarre pas ?</span><button type="button" style="font:inherit;padding:6px 12px;border:0;border-radius:9px;background:#cba6f7;color:#1e1e2e;cursor:pointer">recharger proprement</button>';
      box.querySelector('button').onclick = function () {
        var clear = window.caches ? caches.keys().then(function (keys) { return Promise.all(keys.filter(function (k) { return k.indexOf('cozy-') === 0; }).map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
        var unreg = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
        Promise.all([clear, unreg]).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now().toString(36) + location.hash); });
      };
      document.body.appendChild(box);
    }, 12000);
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <header class="bar" id="bar"></header>
  <div class="desktop">
    <!-- The scrim lives inside .desktop (a stacking context) so the phone menu can sit above it. -->
    <div class="scrim" aria-hidden="true"></div>
    <aside class="window sidebar" id="sidebar" aria-label="Explorateur"></aside>
    <main class="window main" id="main">
      <div class="view" id="view" tabindex="-1">
        <div class="boot"><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span></div>
      </div>
    </main>
  </div>
  <div class="launcher" id="launcher" hidden></div>
  <div id="dock"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
